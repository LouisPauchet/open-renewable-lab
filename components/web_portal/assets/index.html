<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walter Sensor Node</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; max-width: 860px; margin-inline: auto; }
  h1 { font-size: 1.3rem; }
  h2 { font-size: 1.05rem; margin-top: 2rem; border-bottom: 1px solid #8884; padding-bottom: .25rem; }
  table { border-collapse: collapse; width: 100%; margin-top: .5rem; }
  th, td { text-align: left; padding: .3rem .5rem; border-bottom: 1px solid #8884; font-size: .9rem; }
  label { display: block; margin-top: .5rem; font-size: .85rem; }
  input, select { width: 100%; box-sizing: border-box; padding: .35rem; margin-top: .15rem; }
  input[type=checkbox] { width: auto; }
  button { padding: .4rem .9rem; margin-top: .6rem; margin-right: .4rem; cursor: pointer; }
  form { border: 1px solid #8884; border-radius: 6px; padding: .75rem; margin-top: .5rem; }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 140px; }
  .msg { font-size: .85rem; margin-top: .4rem; }
  .msg.err { color: #c0392b; }
  .msg.ok { color: #27ae60; }
  .hidden { display: none; }
  #login-screen { max-width: 320px; margin: 3rem auto; }
  .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .25rem .75rem; font-size: .85rem; }
  .status-grid div:nth-child(odd) { opacity: .7; }
  small { opacity: .7; }
  /* In-page alert/confirm replacement - iOS's captive-portal browser
     (Captive Network Assistant) runs pages in a restricted WKWebView
     that silently suppresses native alert()/confirm()/prompt() dialogs,
     so those can't be relied on here. */
  #modal-overlay { display: none; position: fixed; inset: 0; background: #0008; align-items: center; justify-content: center; z-index: 1000; }
  #modal-overlay.show { display: flex; }
  #modal-box { background: Canvas; color: CanvasText; border: 1px solid #8884; border-radius: 8px; padding: 1rem 1.25rem; max-width: 320px; width: 90%; box-shadow: 0 4px 20px #0006; }
  #modal-msg { font-size: .9rem; margin-bottom: .75rem; white-space: pre-wrap; }
  #modal-buttons { display: flex; justify-content: flex-end; gap: .5rem; }
</style>
</head>
<body>

<section id="login-screen">
  <h1>Walter Sensor Node</h1>
  <form id="login-form">
    <label>Portal password
      <input type="password" id="login-password" autocomplete="current-password" required>
    </label>
    <button type="submit">Log in</button>
    <div class="msg" id="login-msg"></div>
  </form>
</section>

<main id="app" class="hidden">
  <h1>Walter Sensor Node <button id="logout-btn" style="float:right">Log out</button></h1>

  <h2>Status</h2>
  <div class="status-grid" id="status-grid"></div>

  <h2>Variables</h2>
  <table id="variables-table">
    <thead><tr><th>Name</th><th>Bus</th><th>Address</th><th>Sample</th><th>Log</th><th>Aggregates</th><th></th></tr></thead>
    <tbody></tbody>
  </table>
  <button id="add-variable-btn">+ Add variable</button>
  <button id="scan-sdi12-btn">Scan SDI-12 bus</button>
  <button id="scan-i2c-btn">Scan I2C bus</button>
  <form id="variable-form" class="hidden"></form>
  <div class="msg" id="variables-msg"></div>

  <h2>MQTT</h2>
  <form id="mqtt-form"></form>
  <div class="msg" id="mqtt-msg"></div>

  <h2>Network</h2>
  <form id="network-form"></form>
  <div class="msg" id="network-msg"></div>

  <h2>Position reporting</h2>
  <form id="position-form"></form>
  <div class="msg" id="position-msg"></div>

  <h2>Battery monitor</h2>
  <form id="battery-form"></form>
  <div class="msg" id="battery-msg"></div>

  <h2>SD card logging</h2>
  <form id="sd-form"></form>
  <div class="msg" id="sd-msg"></div>

  <h2>Portal password</h2>
  <form id="password-form">
    <label>Current password <input type="password" id="pw-old" required></label>
    <label>New password (min 4 characters) <input type="password" id="pw-new" required></label>
    <button type="submit">Change password</button>
  </form>
  <div class="msg" id="password-msg"></div>

  <h2>Backup</h2>
  <button id="export-btn">Download config backup</button>
  <label>Restore from backup <input type="file" id="import-file" accept="application/json"></label>
  <div class="msg" id="backup-msg"></div>

  <h2>System</h2>
  <button id="reboot-btn">Reboot device</button>
  <button id="factory-reset-btn">Reset all settings</button>
  <div class="msg" id="system-msg"></div>
</main>

<div id="modal-overlay">
  <div id="modal-box">
    <div id="modal-msg"></div>
    <div id="modal-buttons">
      <button id="modal-cancel-btn" type="button">Cancel</button>
      <button id="modal-ok-btn" type="button">OK</button>
    </div>
  </div>
</div>

<script>
const $ = (sel, el) => (el || document).querySelector(sel);

/* alert()/confirm() replacements - see #modal-overlay's CSS comment for
   why native dialogs aren't used here. */
function showModal(message, showCancel) {
  return new Promise((resolve) => {
    $("#modal-msg").textContent = message;
    $("#modal-cancel-btn").classList.toggle("hidden", !showCancel);
    $("#modal-overlay").classList.add("show");
    const okBtn = $("#modal-ok-btn"), cancelBtn = $("#modal-cancel-btn");
    const cleanup = (result) => {
      $("#modal-overlay").classList.remove("show");
      okBtn.removeEventListener("click", onOk);
      cancelBtn.removeEventListener("click", onCancel);
      resolve(result);
    };
    const onOk = () => cleanup(true);
    const onCancel = () => cleanup(false);
    okBtn.addEventListener("click", onOk);
    cancelBtn.addEventListener("click", onCancel);
  });
}
function uiAlert(message) { return showModal(message, false); }
function uiConfirm(message) { return showModal(message, true); }
const AGG_BITS = [ ["raw", 1], ["mean", 2], ["min", 4], ["max", 8], ["stddev", 16] ];
const ADS111X_CHANNEL_LABELS = {
  0: "AIN0-AIN1", 1: "AIN0-AIN3", 2: "AIN1-AIN3", 3: "AIN2-AIN3",
  4: "AIN0", 5: "AIN1", 6: "AIN2", 7: "AIN3",
};
const ADS111X_GAIN_LABELS = {
  0: "+/-6.144V", 1: "+/-4.096V", 2: "+/-2.048V", 3: "+/-1.024V", 4: "+/-0.512V", 5: "+/-0.256V",
};

async function api(path, opts) {
  opts = opts || {};
  opts.credentials = "same-origin";
  if (opts.body && typeof opts.body !== "string") {
    opts.headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
    opts.body = JSON.stringify(opts.body);
  }
  const res = await fetch(path, opts);
  if (res.status === 401) {
    showLogin();
    throw new Error("unauthorized");
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    throw new Error(data.error || ("HTTP " + res.status));
  }
  return data;
}

function showLogin() {
  $("#login-screen").classList.remove("hidden");
  $("#app").classList.add("hidden");
}
function showApp() {
  $("#login-screen").classList.add("hidden");
  $("#app").classList.remove("hidden");
  refreshAll();
}

$("#login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("#login-msg").textContent = "";
  try {
    await api("/api/login", { method: "POST", body: { password: $("#login-password").value } });
    $("#login-password").value = "";
    showApp();
  } catch (err) {
    $("#login-msg").textContent = "Login failed: " + err.message;
    $("#login-msg").className = "msg err";
  }
});

$("#logout-btn").addEventListener("click", async () => {
  await api("/api/logout", { method: "POST" }).catch(() => {});
  showLogin();
});

/* ---- status ---- */
async function refreshStatus() {
  let s;
  try { s = await api("/api/status"); } catch { return; }
  const rows = [
    ["Device ID", s.device_id],
    ["Uptime", s.uptime_s + " s"],
    ["Free heap", s.free_heap_bytes + " bytes"],
    ["AP active", s.ap_active], ["AP clients", s.ap_client_count],
    ["Transport", s.transport], ["Data link up", s.data_connection_up],
    ["Time synced", s.time_synced], ["Time (unix)", s.time_unix],
    ["SD ready", s.sd_ready],
    ["SD free/total", (s.sd_free_bytes || 0) + " / " + (s.sd_total_bytes || 0)],
    ["SD drop count", s.sd_drop_count],
    ["MQTT enabled", s.mqtt_enabled],
    ["MQTT connected", s.mqtt_connected + (s.mqtt_batch_enabled ? " (batched - brief per window)" : "")],
  ];
  if (s.position_available) {
    rows.push(["Position enabled", s.position_enabled]);
    rows.push(["Last fix", s.position_fix_valid
      ? (s.position_latitude.toFixed(5) + ", " + s.position_longitude.toFixed(5) + " (" + s.position_altitude_m.toFixed(0) + "m, ±" + s.position_h_precision_m.toFixed(0) + "m)")
      : "none yet"]);
  }
  rows.push(["Variables", s.variable_count], ["Config generation", s.config_generation]);
  $("#status-grid").innerHTML = rows.map(r => `<div>${r[0]}</div><div>${r[1]}</div>`).join("");
}

/* ---- variables ---- */
function aggMaskToNames(mask) {
  return AGG_BITS.filter(([, bit]) => mask & bit).map(([name]) => name).join(", ");
}
function variableFormFields(v) {
  v = v || { name: "", bus_type: 0, unit: "", sample_interval_ms: 60000, log_interval_ms: 300000, aggregate_mask: 1, enabled: true,
             calibration_a: 1, calibration_b: 0,
             addr: { address: "0", parameter_index: 0, i2c_addr: 0, device_type: 0, channel_index: 0, gain: 1 } };
  return `
    <div class="row">
      <div><label>Name <input name="name" value="${v.name}" required></label></div>
      <div><label>Unit <input name="unit" value="${v.unit || ''}"></label></div>
    </div>
    <label>Bus type
      <select name="bus_type">
        <option value="0" ${v.bus_type == 0 ? "selected" : ""}>SDI-12</option>
        <option value="1" ${v.bus_type == 1 ? "selected" : ""}>I2C</option>
      </select>
    </label>
    <div class="row">
      <div><label>SDI-12 address (0-9,A-Z,a-z) <input name="sdi12_address" maxlength="1" value="${v.addr.address || '0'}"></label></div>
      <div><label>SDI-12 parameter index <input type="number" name="sdi12_parameter_index" value="${v.addr.parameter_index || 0}"></label></div>
    </div>
    <div class="row">
      <div><label>I2C address (decimal) <input type="number" name="i2c_addr" value="${v.addr.i2c_addr || 0}"></label></div>
      <div><label>I2C device type
        <select name="i2c_device_type" id="i2c-device-type-select">
          <option value="0" ${(v.addr.device_type || 0) == 0 ? "selected" : ""}>ADS111x (16-bit ADC)</option>
          <option value="1" ${(v.addr.device_type || 0) == 1 ? "selected" : ""}>Generic (raw 16-bit register)</option>
          <option value="2" ${(v.addr.device_type || 0) == 2 ? "selected" : ""}>Onboard HDC1080 - Temperature (addr 0x40)</option>
          <option value="3" ${(v.addr.device_type || 0) == 3 ? "selected" : ""}>Onboard HDC1080 - Humidity (addr 0x40)</option>
          <option value="4" ${(v.addr.device_type || 0) == 4 ? "selected" : ""}>Onboard LPS22HB - Pressure (addr 0x5C/0x5D)</option>
          <option value="5" ${(v.addr.device_type || 0) == 5 ? "selected" : ""}>Onboard LPS22HB - Temperature (addr 0x5C/0x5D)</option>
          <option value="6" ${(v.addr.device_type || 0) == 6 ? "selected" : ""}>Onboard LTC4015 - Battery monitor (addr 0x68)</option>
        </select>
        <small>The "Onboard" options are Walter Feels' built-in sensors, wired to a separate internal I2C bus - not the external I2C connector.</small>
      </label></div>
    </div>
    <div class="row" data-i2c-mode="0">
      <div><label>ADS111x input
        <select name="i2c_channel_ads111x">
          <option value="4" ${(v.addr.channel_index || 0) == 4 ? "selected" : ""}>AIN0 (single-ended)</option>
          <option value="5" ${(v.addr.channel_index || 0) == 5 ? "selected" : ""}>AIN1 (single-ended)</option>
          <option value="6" ${(v.addr.channel_index || 0) == 6 ? "selected" : ""}>AIN2 (single-ended)</option>
          <option value="7" ${(v.addr.channel_index || 0) == 7 ? "selected" : ""}>AIN3 (single-ended)</option>
          <option value="0" ${(v.addr.channel_index || 0) == 0 ? "selected" : ""}>AIN0 - AIN1 (differential)</option>
          <option value="1" ${(v.addr.channel_index || 0) == 1 ? "selected" : ""}>AIN0 - AIN3 (differential)</option>
          <option value="2" ${(v.addr.channel_index || 0) == 2 ? "selected" : ""}>AIN1 - AIN3 (differential)</option>
          <option value="3" ${(v.addr.channel_index || 0) == 3 ? "selected" : ""}>AIN2 - AIN3 (differential)</option>
        </select>
      </label></div>
      <div><label>ADS111x gain / full-scale range
        <select name="i2c_gain_ads111x">
          <option value="0" ${(v.addr.gain ?? 1) == 0 ? "selected" : ""}>+/-6.144V (lowest resolution)</option>
          <option value="1" ${(v.addr.gain ?? 1) == 1 ? "selected" : ""}>+/-4.096V</option>
          <option value="2" ${(v.addr.gain ?? 1) == 2 ? "selected" : ""}>+/-2.048V</option>
          <option value="3" ${(v.addr.gain ?? 1) == 3 ? "selected" : ""}>+/-1.024V</option>
          <option value="4" ${(v.addr.gain ?? 1) == 4 ? "selected" : ""}>+/-0.512V</option>
          <option value="5" ${(v.addr.gain ?? 1) == 5 ? "selected" : ""}>+/-0.256V (highest resolution)</option>
        </select>
        <small>Pick the smallest range that still covers your signal's peak. The chip's absolute max input is its own supply voltage (VDD) + 0.3V, regardless of this setting.</small>
      </label></div>
    </div>
    <div class="row" data-i2c-mode="1">
      <div><label>Register address <input type="number" name="i2c_channel_generic" value="${v.addr.channel_index || 0}"></label></div>
    </div>
    <div class="row" data-i2c-mode="6">
      <div><label>LTC4015 reading
        <select name="i2c_channel_ltc4015">
          <option value="0" ${(v.addr.channel_index || 0) == 0 ? "selected" : ""}>Battery voltage (VBAT)</option>
          <option value="1" ${(v.addr.channel_index || 0) == 1 ? "selected" : ""}>Input voltage (VIN)</option>
          <option value="2" ${(v.addr.channel_index || 0) == 2 ? "selected" : ""}>Battery current (IBAT)</option>
          <option value="3" ${(v.addr.channel_index || 0) == 3 ? "selected" : ""}>Charger die temperature</option>
        </select>
        <small>Battery voltage uses the chemistry/cell count set under the "Battery monitor" section below. Battery current is positive when charging, negative when discharging.</small>
      </label></div>
    </div>
    <div class="row">
      <div><label>Sample interval (ms) <input type="number" name="sample_interval_ms" value="${v.sample_interval_ms}" required></label></div>
      <div><label>Log/aggregate interval (ms) <input type="number" name="log_interval_ms" value="${v.log_interval_ms}" required></label></div>
    </div>
    <label>Aggregates
      ${AGG_BITS.map(([name, bit]) => `<label style="display:inline-block;width:auto;margin-right:.75rem">
        <input type="checkbox" name="agg_${name}" ${(v.aggregate_mask & bit) ? "checked" : ""}> ${name}</label>`).join("")}
    </label>
    <div class="row">
      <div><label>Calibration multiplier (a) <input type="number" step="any" name="calibration_a" value="${v.calibration_a ?? 1}"></label></div>
      <div><label>Calibration offset (b) <input type="number" step="any" name="calibration_b" value="${v.calibration_b ?? 0}"></label></div>
    </div>
    <small>Applied to every raw sample before logging/aggregation: calibrated = a &times; raw + b. Defaults (a=1, b=0) leave the reading unchanged - e.g. for a voltage divider with a 1/11 ratio, set a to 11.</small>
    <label><input type="checkbox" name="enabled" ${v.enabled ? "checked" : ""}> Enabled</label>
    <button type="submit">Save</button>
    <button type="button" id="cancel-variable-btn">Cancel</button>
  `;
}
function readVariableForm(form) {
  const fd = new FormData(form);
  let mask = 0;
  for (const [name, bit] of AGG_BITS) if (fd.get("agg_" + name)) mask |= bit;
  const bus_type = parseInt(fd.get("bus_type"), 10);
  const device_type = parseInt(fd.get("i2c_device_type") || "0", 10);
  const channel_index = device_type === 0 ? parseInt(fd.get("i2c_channel_ads111x") || "4", 10)
    : device_type === 6 ? parseInt(fd.get("i2c_channel_ltc4015") || "0", 10)
    : parseInt(fd.get("i2c_channel_generic") || "0", 10);
  const gain = parseInt(fd.get("i2c_gain_ads111x") || "1", 10);
  return {
    name: fd.get("name"), unit: fd.get("unit") || "",
    bus_type,
    addr: bus_type === 0
      ? { address: (fd.get("sdi12_address") || "0")[0], parameter_index: parseInt(fd.get("sdi12_parameter_index") || "0", 10) }
      : { i2c_addr: parseInt(fd.get("i2c_addr") || "0", 10), device_type, channel_index, gain },
    sample_interval_ms: parseInt(fd.get("sample_interval_ms"), 10),
    log_interval_ms: parseInt(fd.get("log_interval_ms"), 10),
    aggregate_mask: mask,
    calibration_a: parseFloat(fd.get("calibration_a") || "1"),
    calibration_b: parseFloat(fd.get("calibration_b") || "0"),
    enabled: !!fd.get("enabled"),
  };
}
function updateI2cModeVisibility(form) {
  const deviceType = form.querySelector("#i2c-device-type-select").value;
  form.querySelectorAll("[data-i2c-mode]").forEach(el => {
    el.classList.toggle("hidden", el.dataset.i2cMode !== deviceType);
  });
}
function openVariableForm(v, id) {
  const form = $("#variable-form");
  form.innerHTML = variableFormFields(v);
  form.classList.remove("hidden");
  $("#cancel-variable-btn", form).addEventListener("click", () => form.classList.add("hidden"));
  updateI2cModeVisibility(form);
  form.querySelector("#i2c-device-type-select").addEventListener("change", () => updateI2cModeVisibility(form));
  form.onsubmit = async (e) => {
    e.preventDefault();
    $("#variables-msg").textContent = "";
    try {
      const body = readVariableForm(form);
      if (id) await api("/api/variables/" + id, { method: "PUT", body });
      else await api("/api/variables", { method: "POST", body });
      form.classList.add("hidden");
      await refreshVariables();
    } catch (err) {
      $("#variables-msg").textContent = "Save failed: " + err.message;
      $("#variables-msg").className = "msg err";
    }
  };
}
$("#add-variable-btn").addEventListener("click", () => openVariableForm(null, null));

$("#scan-sdi12-btn").addEventListener("click", async () => {
  $("#variables-msg").textContent = "Scanning (may take a few seconds)...";
  $("#variables-msg").className = "msg";
  try {
    const addrs = await api("/api/bus/sdi12/scan");
    $("#variables-msg").textContent = addrs.length ? ("Found addresses: " + addrs.join(", ")) : "No SDI-12 sensors responded.";
    $("#variables-msg").className = "msg ok";
  } catch (err) {
    $("#variables-msg").textContent = "Scan failed: " + err.message;
    $("#variables-msg").className = "msg err";
  }
});

$("#scan-i2c-btn").addEventListener("click", async () => {
  $("#variables-msg").textContent = "Scanning I2C bus...";
  $("#variables-msg").className = "msg";
  try {
    const addrs = await api("/api/bus/i2c/scan");
    $("#variables-msg").textContent = addrs.length
      ? ("Found addresses: " + addrs.map(a => a + " (0x" + a.toString(16) + ")").join(", ") +
         " - enter the decimal number into \"I2C address\" below")
      : "No I2C devices responded.";
    $("#variables-msg").className = "msg ok";
  } catch (err) {
    $("#variables-msg").textContent = "Scan failed: " + err.message;
    $("#variables-msg").className = "msg err";
  }
});

async function refreshVariables() {
  let vars;
  try { vars = await api("/api/variables"); } catch { return; }
  const tbody = $("#variables-table tbody");
  tbody.innerHTML = "";
  for (const v of vars) {
    const ONBOARD_DEVICE_LABELS = {
      2: "HDC1080 temp", 3: "HDC1080 humidity", 4: "LPS22HB pressure", 5: "LPS22HB temp",
    };
    const LTC4015_CHANNEL_LABELS = { 0: "VBAT", 1: "VIN", 2: "IBAT", 3: "die temp" };
    const i2cChannelLabel = v.addr.device_type === 0
      ? (ADS111X_CHANNEL_LABELS[v.addr.channel_index] || v.addr.channel_index) +
        " @ " + (ADS111X_GAIN_LABELS[v.addr.gain] || ADS111X_GAIN_LABELS[1])
      : v.addr.device_type === 6 ? ("LTC4015 " + (LTC4015_CHANNEL_LABELS[v.addr.channel_index] || v.addr.channel_index))
      : ONBOARD_DEVICE_LABELS[v.addr.device_type] ? ONBOARD_DEVICE_LABELS[v.addr.device_type]
      : ("reg " + v.addr.channel_index);
    const addr = v.bus_type === 0 ? ("addr " + v.addr.address + " #" + v.addr.parameter_index)
                                   : ("0x" + v.addr.i2c_addr.toString(16) + " " + i2cChannelLabel);
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${v.name}${v.enabled ? "" : " (disabled)"}</td>
      <td>${v.bus_type === 0 ? "SDI-12" : "I2C"}</td><td>${addr}</td>
      <td>${v.sample_interval_ms} ms</td><td>${v.log_interval_ms} ms</td>
      <td>${aggMaskToNames(v.aggregate_mask)}</td>
      <td>
        <button data-act="preview">Preview</button>
        <button data-act="edit">Edit</button>
        <button data-act="delete">Delete</button>
      </td>`;
    tr.querySelector('[data-act=preview]').addEventListener("click", async () => {
      try {
        const r = await api("/api/variables/" + v.id + "/preview", { method: "POST" });
        await uiAlert(v.name + " = " + r.value);
      } catch (err) { await uiAlert("Preview failed: " + err.message); }
    });
    tr.querySelector('[data-act=edit]').addEventListener("click", () => openVariableForm(v, v.id));
    tr.querySelector('[data-act=delete]').addEventListener("click", async () => {
      if (!(await uiConfirm("Delete variable '" + v.name + "'?"))) return;
      await api("/api/variables/" + v.id, { method: "DELETE" });
      await refreshVariables();
    });
    tbody.appendChild(tr);
  }
}

/* ---- MQTT settings ---- */
function mqttFormFields(m) {
  return `
    <label><input type="checkbox" name="enabled" ${m.enabled ? "checked" : ""}> Enabled</label>
    <div class="row">
      <div><label>Host <input name="host" value="${m.host}"></label></div>
      <div><label>Port <input type="number" name="port" value="${m.port}"></label></div>
    </div>
    <label><input type="checkbox" name="use_tls" ${m.use_tls ? "checked" : ""}> Use TLS (MQTTS)</label>
    <label><input type="checkbox" name="tls_allow_insecure" ${m.tls_allow_insecure ? "checked" : ""}> Allow insecure TLS (skip cert validation)</label>
    <small>WiFi transport: intended for lab/self-signed brokers. Cellular transport: certificate validation only works if your broker's certificate is signed by Let's Encrypt (the modem's on-board MQTT client validates against a fixed, built-in Let's Encrypt root - it can't take an arbitrary uploaded certificate yet) - check this box if your broker uses a different CA or a self-signed certificate.</small>
    <div class="row">
      <div><label>Client ID <input name="client_id" value="${m.client_id}"></label></div>
      <div><label>Username <input name="username" value="${m.username}"></label></div>
    </div>
    <label>Password ${m.password_set ? "<small>(already set - leave blank to keep)</small>" : ""} <input type="password" name="password"></label>
    <label>Topic prefix <input name="topic_prefix" value="${m.topic_prefix}"></label>
    <label><input type="checkbox" name="flat_telemetry" ${m.flat_telemetry ? "checked" : ""}> Flat telemetry topic (publish directly to "Topic prefix" with keys like "&lt;variable&gt;_mean" - for platforms like ThingsBoard/AWS IoT that expect a single fixed topic, instead of one topic per variable)</label>
    <label><input type="checkbox" name="batch_enabled" ${m.batch_enabled ? "checked" : ""}> Batch transmission (connect, send buffered data, disconnect - saves power, especially over cellular)</label>
    <label>Batch interval (ms) <input type="number" name="batch_interval_ms" value="${m.batch_interval_ms}"></label>
    <button type="submit">Save MQTT settings</button>
  `;
}
async function refreshMqtt() {
  let m;
  try { m = await api("/api/settings/mqtt"); } catch { return; }
  const form = $("#mqtt-form");
  form.innerHTML = mqttFormFields(m);
  form.onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const body = {
      enabled: !!fd.get("enabled"), host: fd.get("host"), port: parseInt(fd.get("port"), 10),
      use_tls: !!fd.get("use_tls"), tls_allow_insecure: !!fd.get("tls_allow_insecure"),
      client_id: fd.get("client_id"), username: fd.get("username"), topic_prefix: fd.get("topic_prefix"),
      flat_telemetry: !!fd.get("flat_telemetry"),
      batch_enabled: !!fd.get("batch_enabled"), batch_interval_ms: parseInt(fd.get("batch_interval_ms"), 10),
    };
    if (fd.get("password")) body.password = fd.get("password");
    try {
      await api("/api/settings/mqtt", { method: "PUT", body });
      $("#mqtt-msg").textContent = "Saved."; $("#mqtt-msg").className = "msg ok";
      await refreshMqtt();
    } catch (err) {
      $("#mqtt-msg").textContent = "Save failed: " + err.message; $("#mqtt-msg").className = "msg err";
    }
  };
}

/* ---- Network settings ---- */
function networkFormFields(n) {
  return `
    <label>Transport
      <select name="transport">
        <option value="unconfigured" ${n.transport === "unconfigured" ? "selected" : ""}>Unconfigured</option>
        <option value="wifi" ${n.transport === "wifi" ? "selected" : ""}>WiFi</option>
        <option value="cellular" ${n.transport === "cellular" ? "selected" : ""}>Cellular</option>
      </select>
    </label>
    <div class="row">
      <div><label>WiFi SSID <input name="wifi_sta_ssid" value="${n.wifi_sta_ssid}"></label></div>
      <div><label>WiFi password ${n.wifi_sta_password_set ? "<small>(set - leave blank to keep)</small>" : ""} <input type="password" name="wifi_sta_password"></label></div>
    </div>
    <div class="row">
      <div><label>Cellular APN <input name="cellular_apn" id="cellular-apn-input" value="${n.cellular_apn}"></label>
        <button type="button" id="apn-autodetect-btn">Auto-detect</button>
        <small>Most networks negotiate the APN automatically when this is left blank - "Auto-detect" just clears it.</small>
      </div>
      <div><label>SIM PIN ${n.cellular_pin_set ? "<small>(set - leave blank to keep)</small>" : ""} <input type="password" name="cellular_pin"></label></div>
    </div>
    <button type="submit">Save network settings</button>
    <small>Changing transport requires a reboot to take effect.</small>
  `;
}
async function refreshNetwork() {
  let n;
  try { n = await api("/api/settings/network"); } catch { return; }
  const form = $("#network-form");
  form.innerHTML = networkFormFields(n);
  $("#apn-autodetect-btn", form).addEventListener("click", () => {
    $("#cellular-apn-input", form).value = "";
  });
  form.onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const body = { transport: fd.get("transport"), wifi_sta_ssid: fd.get("wifi_sta_ssid"), cellular_apn: fd.get("cellular_apn") };
    if (fd.get("wifi_sta_password")) body.wifi_sta_password = fd.get("wifi_sta_password");
    if (fd.get("cellular_pin")) body.cellular_pin = fd.get("cellular_pin");
    try {
      const r = await api("/api/settings/network", { method: "PUT", body });
      $("#network-msg").textContent = "Saved." + (r.reboot_required ? " Reboot required to apply." : "");
      $("#network-msg").className = "msg ok";
      await refreshNetwork();
    } catch (err) {
      $("#network-msg").textContent = "Save failed: " + err.message; $("#network-msg").className = "msg err";
    }
  };
}

/* ---- Position (GNSS) reporting ---- */
function positionFormFields(p) {
  return `
    <small>&#9888; Requires a physical GNSS/GPS antenna connected to the modem. Without one, the device will keep
    trying and failing to get a fix (logged, harmless) but will never actually report a position.</small><br>
    ${p.available ? "" : "<small>Position reporting also requires network transport set to Cellular (Walter's GNSS is part of the cellular modem).</small>"}
    <label><input type="checkbox" name="enabled" ${p.enabled ? "checked" : ""} ${p.available ? "" : "disabled"}> Enabled</label>
    <div class="row">
      <div><label>Sample interval (ms) <input type="number" name="sample_interval_ms" value="${p.sample_interval_ms}" ${p.available ? "" : "disabled"} required></label></div>
      <div><label>Log/aggregate interval (ms) <input type="number" name="log_interval_ms" value="${p.log_interval_ms}" ${p.available ? "" : "disabled"} required></label></div>
    </div>
    <small>Same idea as a sensor variable: a fix is attempted every sample interval; the fixes since the last log
    interval are aggregated (per the checkboxes below) into one latitude/longitude/elevation/horizontal-precision
    record and logged/published. Each GPS fix can itself take up to a minute and briefly drops the cellular
    connection to use the modem's shared antenna, so keep the sample interval reasonably long.</small>
    <label>Aggregates
      ${AGG_BITS.map(([name, bit]) => `<label style="display:inline-block;width:auto;margin-right:.75rem">
        <input type="checkbox" name="agg_${name}" ${(p.aggregate_mask & bit) ? "checked" : ""} ${p.available ? "" : "disabled"}> ${name}</label>`).join("")}
    </label>
    <button type="submit" ${p.available ? "" : "disabled"}>Save position settings</button>
  `;
}
async function refreshPosition() {
  let p;
  try { p = await api("/api/settings/position"); } catch { return; }
  const form = $("#position-form");
  form.innerHTML = positionFormFields(p);
  form.onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    let mask = 0;
    for (const [name, bit] of AGG_BITS) if (fd.get("agg_" + name)) mask |= bit;
    const body = {
      enabled: !!fd.get("enabled"),
      sample_interval_ms: parseInt(fd.get("sample_interval_ms"), 10),
      log_interval_ms: parseInt(fd.get("log_interval_ms"), 10),
      aggregate_mask: mask,
    };
    try {
      await api("/api/settings/position", { method: "PUT", body });
      $("#position-msg").textContent = "Saved."; $("#position-msg").className = "msg ok";
      await refreshPosition();
    } catch (err) {
      $("#position-msg").textContent = "Save failed: " + err.message; $("#position-msg").className = "msg err";
    }
  };
}

/* ---- Battery monitor (onboard LTC4015, Walter Feels only) ---- */
function batteryFormFields(b) {
  return `
    <label>Battery chemistry
      <select name="chemistry">
        <option value="0" ${b.chemistry == 0 ? "selected" : ""}>Li-Ion / Li-Po</option>
        <option value="1" ${b.chemistry == 1 ? "selected" : ""}>LiFePO4</option>
        <option value="2" ${b.chemistry == 2 ? "selected" : ""}>Lead-acid</option>
      </select>
    </label>
    <label>Cell count <input type="number" name="cell_count" min="1" value="${b.cell_count}"></label>
    <small>Chemistry and cell count only calibrate the voltage reading below (and any "Battery voltage" Variable
      you add manually) - they don't publish anything on their own.</small>
    <label><input type="checkbox" name="enabled" ${b.enabled ? "checked" : ""}> Publish battery voltage over MQTT</label>
    <label><input type="checkbox" name="sync_with_mqtt" ${b.sync_with_mqtt ? "checked" : ""}>
      Report alongside every MQTT publish instead of on its own schedule</label>
    <label>Publish interval (ms) - ignored if "report alongside" above is checked
      <input type="number" name="interval_ms" min="1000" value="${b.interval_ms}"></label>
    <button type="submit">Save battery settings</button>
  `;
}
async function refreshBattery() {
  let b;
  try { b = await api("/api/settings/battery"); } catch { return; }
  const form = $("#battery-form");
  form.innerHTML = batteryFormFields(b);
  form.onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const body = {
      chemistry: parseInt(fd.get("chemistry"), 10), cell_count: parseInt(fd.get("cell_count"), 10),
      enabled: !!fd.get("enabled"), interval_ms: parseInt(fd.get("interval_ms"), 10),
      sync_with_mqtt: !!fd.get("sync_with_mqtt"),
    };
    try {
      await api("/api/settings/battery", { method: "PUT", body });
      $("#battery-msg").textContent = "Saved."; $("#battery-msg").className = "msg ok";
      await refreshBattery();
    } catch (err) {
      $("#battery-msg").textContent = "Save failed: " + err.message; $("#battery-msg").className = "msg err";
    }
  };
}

/* ---- SD card logging format ---- */
function sdFormFields(s) {
  return `
    <label>Log format
      <select name="log_format">
        <option value="0" ${s.log_format == 0 ? "selected" : ""}>Long (one row per variable/aggregate event)</option>
        <option value="1" ${s.log_format == 1 ? "selected" : ""}>Wide, simple header (one row per scan, station info + variable_agg_unit columns)</option>
        <option value="2" ${s.log_format == 2 ? "selected" : ""}>Wide, TOA5 format (Campbell Scientific-compatible)</option>
      </select>
    </label>
    <label>Station name <input name="station_name" value="${s.station_name || ''}" placeholder="(defaults to device ID if blank)"></label>
    <button type="submit">Save SD logging settings</button>
    <small>Wide formats group variables sharing the same log interval into one file/row each, like a datalogger's output tables - variables with different log intervals land in separate files. Changing the format takes effect for newly-created files (a new day's file, or the next time the variable set for an interval group changes) - it won't rewrite already-logged data.</small>
  `;
}
async function refreshSd() {
  let s;
  try { s = await api("/api/settings/sd"); } catch { return; }
  const form = $("#sd-form");
  form.innerHTML = sdFormFields(s);
  form.onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const body = { log_format: parseInt(fd.get("log_format"), 10), station_name: fd.get("station_name") || "" };
    try {
      await api("/api/settings/sd", { method: "PUT", body });
      $("#sd-msg").textContent = "Saved."; $("#sd-msg").className = "msg ok";
      await refreshSd();
    } catch (err) {
      $("#sd-msg").textContent = "Save failed: " + err.message; $("#sd-msg").className = "msg err";
    }
  };
}

/* ---- password ---- */
$("#password-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  try {
    await api("/api/settings/password", { method: "PUT", body: { old: $("#pw-old").value, new: $("#pw-new").value } });
    $("#pw-old").value = ""; $("#pw-new").value = "";
    $("#password-msg").textContent = "Password changed."; $("#password-msg").className = "msg ok";
  } catch (err) {
    $("#password-msg").textContent = "Failed: " + err.message; $("#password-msg").className = "msg err";
  }
});

/* ---- backup ---- */
$("#export-btn").addEventListener("click", async () => {
  const data = await api("/api/settings/export");
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "walter-sensor-config.json";
  a.click();
});
$("#import-file").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const r = await api("/api/settings/import", { method: "POST", body: text });
    $("#backup-msg").textContent = "Imported." + (r.reboot_required ? " Reboot required." : "");
    $("#backup-msg").className = "msg ok";
    await refreshAll();
  } catch (err) {
    $("#backup-msg").textContent = "Import failed: " + err.message; $("#backup-msg").className = "msg err";
  }
});

/* ---- reboot ---- */
$("#reboot-btn").addEventListener("click", async () => {
  if (!(await uiConfirm("Reboot the device now?"))) return;
  await api("/api/system/reboot", { method: "POST" }).catch(() => {});
  await uiAlert("Rebooting. Reconnect to the portal in a moment.");
});

/* ---- factory reset ---- */
$("#factory-reset-btn").addEventListener("click", async () => {
  const ok = await uiConfirm(
    "Erase ALL stored settings (variables, network/cellular, MQTT, position, battery, SD logging, portal password) " +
    "and reboot?\n\nThis cannot be undone - the device will restart with the factory-default configuration and " +
    "you'll need to set it up again through this portal."
  );
  if (!ok) return;
  try {
    await api("/api/system/factory_reset", { method: "POST" });
    await uiAlert("Settings erased. Rebooting - reconnect to the portal in a moment.");
  } catch (err) {
    $("#system-msg").textContent = "Factory reset failed: " + err.message;
    $("#system-msg").className = "msg err";
  }
});

async function refreshAll() {
  await Promise.all([refreshStatus(), refreshVariables(), refreshMqtt(), refreshNetwork(), refreshPosition(), refreshBattery(), refreshSd()]);
}
setInterval(() => { if (!$("#app").classList.contains("hidden")) refreshStatus(); }, 5000);

/* Try loading status on page load to detect an already-active session. */
api("/api/status").then(showApp).catch(() => showLogin());
</script>
</body>
</html>
