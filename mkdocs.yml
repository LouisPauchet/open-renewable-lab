site_name: Open Renewable Lab
site_description: >-
  Firmware and setup documentation for the UNIS Open Renewable Lab sensor
  node (Walter ESP32-S3 + Walter Feels carrier board).
site_url: https://<OWNER>.github.io/<REPO>/
repo_url: https://github.com/<OWNER>/<REPO>
repo_name: <OWNER>/<REPO>
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - toc.follow
    - content.code.copy

nav:
  - Home: index.md
  - Build a Datalogger: build_datalogger.md
  - Getting Started (PV panel & wind turbine): getting-started.md
  - Firmware Downloads: firmware-downloads.md
  - User Manual: USER_MANUAL.md
  - Hardware: hardware.md
  - Developer Guide: DEVELOPER_GUIDE.md

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.details
  - tables
  - fenced_code
  - attr_list
  - md_in_html

plugins:
  - search

# The combined-PDF export (mkdocs-with-pdf) lives in mkdocs-pdf.yml, not
# here - deliberately not just gated by ENABLE_PDF_EXPORT/enabled_if_env
# in this file, because that plugin always logs a WARNING-level "not
# generating PDF" notice when its own enabled_if_env var isn't set, and
# `mkdocs build --strict` (used by both the docs.yml Pages deploy and this
# same command) treats any WARNING as fatal - the plugin being merely
# a no-op isn't enough, it still breaks --strict. Splitting it into a
# separate config that only release.yml uses (mkdocs build --strict
# --config-file mkdocs-pdf.yml) means the plugin is never loaded at all
# for the fast HTML-only Pages build, so it has nothing to warn about.
